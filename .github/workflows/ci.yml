name: Build, Scan, Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  # ── 1. Build WAR ─────────────────────────────────────────────
  build-war:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Build WAR
        run: gradle clean war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: build/libs/*.war

  # ── 2. Docker build + Trivy scan + push ──────────────────────
  build-scan-push:
    runs-on: ubuntu-latest
    needs: build-war
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-war
          path: build/libs/

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:latest

      - name: Scan Docker Image using Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Version Tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }}

      - name: Push Latest Tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:latest

  # ── 3. Update GitOps repo ────────────────────────────────────
  update-gitops-repo:
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: prema-sagar/insurance-gitops-repo
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update Deployment YAML with new image tag
        run: |
          sed -i "s|image: .*/insurance-health-component:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }}|" deployment.yaml
          git config --global user.email "ci-bot@example.com"
          git config --global user.name "CI Bot"
          git commit -am "Update image tag to ${{ github.run_number }}"
          git push

  # ── 4. BDD Tests (ArgoCD + Kubernetes Verified) ───────────────
  bdd-acceptance-tests:
    runs-on: ubuntu-latest
    needs: update-gitops-repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      # ✅ Step 1: Wait for ArgoCD sync
      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting for ArgoCD sync..."

          for i in $(seq 1 40); do
            SYNC=$(kubectl get application insurance-health-app -n argocd \
              -o jsonpath="{.status.sync.status}")

            HEALTH=$(kubectl get application insurance-health-app -n argocd \
              -o jsonpath="{.status.health.status}")

            echo "Attempt $i — Sync: $SYNC | Health: $HEALTH"

            if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "✅ ArgoCD sync completed"
              break
            fi

            if [ "$i" = "40" ]; then
              echo "❌ ArgoCD sync failed"
              exit 1
            fi

            sleep 15
          done

      # ✅ Step 2: Verify deployment image + rollout
      - name: Wait for latest deployment rollout
        run: |
          echo "Waiting for latest deployment image..."

          EXPECTED="${{ secrets.DOCKERHUB_USERNAME }}/insurance-health-component:${{ github.run_number }}"

          for i in $(seq 1 40); do
            CURRENT=$(kubectl get deployment insurance-health-app -n insurance-app \
              -o jsonpath="{.spec.template.spec.containers[0].image}")

            echo "Attempt $i — Current: $CURRENT | Expected: $EXPECTED"

            if [ "$CURRENT" = "$EXPECTED" ]; then
              echo "✅ Correct image detected"

              kubectl rollout status deployment/insurance-health-app \
                -n insurance-app --timeout=300s

              echo "✅ Rollout completed"
              break
            fi

            if [ "$i" = "40" ]; then
              echo "❌ Deployment not updated"
              exit 1
            fi

            sleep 15
          done

      # ✅ Step 3: Final health check
      - name: Verify application health
        run: |
          for i in $(seq 1 20); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.APP_BASE_URL }}/ClaimsSoapService" || echo "000")

            echo "Attempt $i — HTTP $HTTP"

            if [ "$HTTP" = "200" ]; then
              echo "✅ App is healthy"
              break
            fi

            if [ "$i" = "20" ]; then
              echo "❌ App not healthy"
              exit 1
            fi

            sleep 10
          done

      # ✅ Step 4: Run BDD tests (latest pod only)
      - name: Run BDD Cucumber Acceptance Tests
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: gradle acceptanceTest

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_number }}
          path: build/cucumber-reports/

      - name: Upload Cucumber JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-${{ github.run_number }}
          path: build/cucumber-reports/cucumber.json
